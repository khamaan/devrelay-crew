[project]
name = "devrelay-crew"
version = "0.1.0"
description = "A small browser-based multi-agent coding demo powered by CrewAI and Gemini"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["crewai[google-genai]>=1.15.23,<2", "orjson==3.12.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["devrelay"]

[tool.hatch.build.targets.wheel.force-include]
"devrelay/static" = "devrelay/static"
